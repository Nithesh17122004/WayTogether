databases:
  - name: waytogether-db
    plan: free
    region: singapore
    databaseName: waytogether_db
    user: waytogether_db_user

services:
  - type: web
    name: waytogether-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py bootstrap_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 60 --max-requests 400 --max-requests-jitter 40
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DJANGO_ALLOWED_HOSTS
        value: waytogether-api-t8vs.onrender.com,api.waytogether.aclclouds.online
      - key: DATABASE_URL
        fromDatabase:
          name: waytogether-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: waytogether-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://waytogether-web-azfy.onrender.com,https://waytogether.aclclouds.online
      - key: CSRF_TRUSTED_ORIGINS
        value: https://waytogether-web-azfy.onrender.com,https://waytogether.aclclouds.online,https://waytogether-api-t8vs.onrender.com,https://api.waytogether.aclclouds.online
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_PROXY_SSL_HEADER
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "false"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "false"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "WayTogether <no-reply@waytogether.aclclouds.online>"
      - key: MAPS_USER_AGENT
        value: "WayTogether/1.0 (https://waytogether.aclclouds.online)"
      - key: PHOTON_URL
        value: "https://photon.komoot.io/api/"
      - key: OSRM_ROUTE_URL
        value: "https://router.project-osrm.org/route/v1/driving"
      - key: FINANCE_SANDBOX_ENABLED
        value: "false"
      - key: RAZORPAY_TEST_MODE
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Keep identity uploads disabled until a private bucket has been created and credentials added.
      - key: PRIVATE_MEDIA_STORAGE_READY
        sync: false
      - key: PRIVATE_MEDIA_BUCKET_NAME
        sync: false
      - key: PRIVATE_MEDIA_ENDPOINT_URL
        sync: false
      - key: PRIVATE_MEDIA_ACCESS_KEY_ID
        sync: false
      - key: PRIVATE_MEDIA_SECRET_ACCESS_KEY
        sync: false
      - key: PRIVATE_MEDIA_REGION_NAME
        value: "auto"

  - type: web
    name: waytogether-web
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://waytogether-api-t8vs.onrender.com/api/v1
      - key: VITE_OSM_TILE_URL
        value: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
      - key: VITE_OSM_TILE_ATTRIBUTION
        value: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'

  - type: keyvalue
    name: waytogether-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
