name: WayTogether CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase-1-foundation]

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build website
        working-directory: frontend
        run: npm run build

  backend:
    name: Django checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system check
        working-directory: backend
        run: python manage.py check
      - name: Production security checks
        working-directory: backend
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-only-random-secret-key-for-production-system-checks-000000000000000000000000"
          DJANGO_ALLOWED_HOSTS: "api.example.com"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          CORS_ALLOWED_ORIGINS: "https://app.example.com"
          CSRF_TRUSTED_ORIGINS: "https://app.example.com"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy
      - name: Check migration consistency
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        working-directory: backend
        run: python manage.py test
